name: Review Zero

# Runs regression tests plus the MECHANICAL half of Round-0 in CI.
# The adversarial full-diff read remains mandatory and cannot be scripted.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: review-zero-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review-zero:
    name: Tests + mechanical Round-0 checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required: review-zero diffs against the merge base.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Run review-zero
        run: |
          python scripts/review_zero.py \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --ci
